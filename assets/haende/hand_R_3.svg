<?xml version="1.0" encoding="UTF-8"?>
<svg class="hand-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" role="img" aria-label="Rechte Hand: 3 Finger"><g>
      <!-- Daumen offen -->
      <path d="M 30 74 L 10 54 C 5 49 5 41 11 37 C 16 33 23 36 27 42 L 36 55 Z"
            fill="#ffffff" stroke="#1e293b" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M 11 45 A 3.5 3.5 0 0 1 16 40" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Zeigefinger offen -->
      <rect x="28" y="14" width="13" height="46" rx="6.5" fill="#ffffff" stroke="#1e293b" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M31 23 A3.5 3.5 0 0 1 38 23" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="31" y1="36" x2="38" y2="36" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Mittelfinger offen -->
      <rect x="43" y="7" width="13" height="53" rx="6.5" fill="#ffffff" stroke="#1e293b" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M46 16 A3.5 3.5 0 0 1 53 16" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="46" y1="31" x2="53" y2="31" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Handfläche mit Handgelenk -->
    <path d="M 27 52
             C 27 47, 85 47, 85 54
             L 85 73
             C 85 86, 74 94, 65 96
             L 65 104
             L 39 104
             L 39 95
             C 30 92, 26 83, 27 71
             Z"
          fill="#ffffff" stroke="#1e293b" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Dezente Handflächen-Linie -->
    <path d="M 38 74 Q 55 68 73 75" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <!-- Ringfinger eingeklappt -->
      <rect x="58" y="43" width="13.5" height="23" rx="6.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="3.2"/>
      <path d="M 61 59 A 3.5 3.5 0 0 0 68.5 59" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Kleiner Finger eingeklappt -->
      <rect x="73" y="46" width="12" height="21" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="3.2"/>
      <path d="M 76 60 A 3 3 0 0 0 82 60" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/></g></svg>