<?xml version="1.0" encoding="UTF-8"?>
<svg class="hand-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" role="img" aria-label="Linke Hand: 0 Finger"><g transform="translate(100, 0) scale(-1, 1)">
    <!-- Handfläche mit Handgelenk -->
    <path d="M 27 52
             C 27 47, 85 47, 85 54
             L 85 73
             C 85 86, 74 94, 65 96
             L 65 104
             L 39 104
             L 39 95
             C 30 92, 26 83, 27 71
             Z"
          fill="#ffffff" stroke="#1e293b" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Dezente Handflächen-Linie -->
    <path d="M 38 74 Q 55 68 73 75" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <!-- Zeigefinger eingeklappt -->
      <rect x="28" y="43" width="13.5" height="23" rx="6.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="3.2"/>
      <path d="M 31 59 A 3.5 3.5 0 0 0 38.5 59" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Mittelfinger eingeklappt -->
      <rect x="43" y="41" width="13.5" height="25" rx="6.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="3.2"/>
      <path d="M 46 59 A 3.5 3.5 0 0 0 53.5 59" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Ringfinger eingeklappt -->
      <rect x="58" y="43" width="13.5" height="23" rx="6.5" fill="#f1f5f9" stroke="#1e293b" stroke-width="3.2"/>
      <path d="M 61 59 A 3.5 3.5 0 0 0 68.5 59" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Kleiner Finger eingeklappt -->
      <rect x="73" y="46" width="12" height="21" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="3.2"/>
      <path d="M 76 60 A 3 3 0 0 0 82 60" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Daumen eingeklappt -->
      <path d="M 24 66 C 24 58, 34 55, 48 59 C 53 61, 54 68, 48 71 C 38 74, 24 73, 24 66 Z"
            fill="#f1f5f9" stroke="#1e293b" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M 44 62 A 3 3 0 0 1 44 68" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"/></g></svg>